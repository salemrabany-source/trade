<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تحليل أسهم بورصة قطر</title>
  <meta name="theme-color" content="#071b2e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#071b2e;--navy-2:#0e3150;--blue:#176b87;--green:#0d9276;--red:#d14d58;--gold:#d7a84b;--amber:#b97818;--ink:#132a3a;--muted:#6e7f8c;--bg:#f3f7f9;--card:#fff;--line:#dce7ec;--shadow:0 18px 50px rgba(7,27,46,.09)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,rgba(39,144,160,.13),transparent 30%),linear-gradient(180deg,#edf5f7 0,#f8fafb 420px);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif}
    body:before{content:'';position:absolute;inset:0 0 auto;height:370px;background:linear-gradient(135deg,var(--navy),#0b3550 70%,#106276);z-index:-1;clip-path:ellipse(90% 70% at 50% 20%)}
    main{width:min(1120px,92%);margin:0 auto;padding:48px 0 54px}.hero{text-align:center;color:#fff;margin-bottom:30px}.brand{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(255,255,255,.08);font-size:13px;font-weight:600}.brand i{width:8px;height:8px;border-radius:50%;background:#50e3b4;box-shadow:0 0 12px #50e3b4}.hero h1{font-size:clamp(31px,5vw,53px);line-height:1.25;margin:18px 0 8px;font-weight:800;letter-spacing:-1.5px}.hero p{color:#d5e5eb;margin:0;font-size:clamp(14px,2vw,17px)}
    .search-wrap{padding:7px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:22px;box-shadow:0 22px 55px rgba(4,24,39,.24);backdrop-filter:blur(12px)}.search{display:flex;gap:9px;padding:9px;background:#fff;border-radius:15px}.search input{flex:1;min-width:0;padding:14px 18px;border:0;outline:0;border-radius:11px;background:#f5f8fa;color:var(--ink);font:600 15px 'Cairo',sans-serif}.search input:focus{box-shadow:inset 0 0 0 2px rgba(23,107,135,.3);background:#fff}.search button{padding:0 28px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--gold),#efc66d);color:#37270a;font:800 15px 'Cairo',sans-serif;cursor:pointer;transition:.2s}.search button:hover{transform:translateY(-1px);filter:brightness(1.04)}
    #message{margin:14px 8px 20px;color:#557080;min-height:24px;text-align:center;font-size:13px;font-weight:600}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:rgba(255,255,255,.97);border:1px solid rgba(213,226,232,.9);border-radius:22px;padding:25px;box-shadow:var(--shadow)}.stock-card{position:relative;overflow:hidden}.stock-card:after{content:'';position:absolute;width:145px;height:145px;border-radius:50%;background:rgba(23,107,135,.07);left:-55px;bottom:-65px}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;margin:0 0 7px}.stock-card h2{margin:0;font-size:25px}.symbol{color:var(--muted);direction:ltr;display:inline-block;font-weight:700;font-size:13px}.price{font-size:46px;font-weight:800;margin:16px 0 7px;direction:ltr;text-align:right;letter-spacing:-1px}.quote-line{margin:0;color:var(--muted);font-size:13px}
    .signal-browser{margin:0 0 20px}.signal-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.signal-tab{border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px 10px;font:800 14px 'Cairo';color:var(--ink);cursor:pointer;box-shadow:0 8px 24px rgba(7,27,46,.06);transition:.2s}.signal-tab:hover,.signal-tab.active{transform:translateY(-1px);border-color:currentColor}.signal-tab.buy{color:var(--green)}.signal-tab.sell{color:var(--red)}.signal-tab.watch{color:var(--amber)}.signal-tab b{display:inline-grid;place-items:center;min-width:25px;height:25px;margin-right:6px;border-radius:999px;background:currentColor;color:#fff;font-size:11px}.signal-list{margin-top:10px;padding:15px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.signal-list.hidden{display:none}.signal-list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.signal-list-head h2{margin:0;font-size:17px}.signal-list-head small{color:var(--muted)}.signal-row{width:100%;display:grid;grid-template-columns:1.5fr .6fr .8fr .8fr;gap:8px;align-items:center;border:0;border-top:1px solid var(--line);background:#fff;padding:12px 4px;color:var(--ink);font:600 12px 'Cairo';cursor:pointer;text-align:right}.signal-row:first-child{border-top:0}.signal-row:hover{background:#f7fafb}.signal-row strong{font-size:13px}.signal-row span{direction:ltr;text-align:center}.signal-empty{text-align:center;color:var(--muted);padding:18px}
    .decision{color:#fff;background:linear-gradient(145deg,#bd821d,#946214);border:0;position:relative;overflow:hidden}.decision:after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;border:35px solid rgba(255,255,255,.06);left:-70px;top:-75px}.decision.buy{background:linear-gradient(145deg,#0d9878,#08705e)}.decision.sell{background:linear-gradient(145deg,#d7555e,#a93242)}.decision small{color:#ffffffbf;font-weight:600}.decision h2{font-size:40px;margin:10px 0 4px;position:relative;z-index:1}.decision p{color:#ffffffe6;min-height:42px;font-size:13px}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.levels>div{padding:11px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.11);border-radius:12px}.levels span{display:block;color:#ffffffb8;font-size:10px}.levels b{direction:ltr;display:block;margin-top:4px;font-size:14px}.signal-note{position:relative;z-index:1;margin-top:10px;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.1);font-size:11px;color:#fff}.signal-note:empty{display:none}
    .checks{margin-top:18px}.section-title{display:flex;align-items:center;gap:9px;margin:0 0 8px;font-size:20px}.section-title:before{content:'';width:5px;height:25px;border-radius:4px;background:linear-gradient(var(--blue),#39a99d)}.check{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding:13px 3px;font-size:13px}.check:last-child{border:0}.check b{font-size:12px;white-space:nowrap}.ok{color:var(--green)}.no{color:var(--red)}
    .chart{height:560px;margin-top:18px;padding:18px;overflow:hidden}.chart-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 4px 12px}.chart-head h2{margin:0;font-size:18px}.chart-tools{display:flex;align-items:center;gap:7px}.chart-tools span{direction:ltr;color:var(--muted);font-size:11px;font-weight:700}.interval-btn{border:1px solid var(--line);background:#f5f8fa;color:var(--muted);border-radius:8px;padding:5px 10px;font:700 11px 'Cairo';cursor:pointer}.interval-btn.active{background:var(--navy-2);border-color:var(--navy-2);color:#fff}.chart-box{height:calc(100% - 42px);position:relative;border-radius:15px;overflow:hidden;background:#fbfdfe;border:1px solid var(--line)}.chart-box canvas{display:block;width:100%;height:100%}.chart-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:25px;color:var(--muted);font-size:14px}.hidden{display:none}
    @media(max-width:720px){main{width:min(94%,1120px);padding-top:30px}.hero h1{letter-spacing:-1px}.search-wrap{border-radius:18px}.search{flex-direction:column}.search button{height:50px}.signal-tabs{grid-template-columns:1fr}.signal-row{grid-template-columns:1.4fr .6fr .8fr}.signal-row .stop-col{display:none}.grid{grid-template-columns:1fr}.card{padding:20px;border-radius:18px}.price{font-size:38px}.decision h2{font-size:34px}.levels{gap:6px}.levels>div{padding:9px 6px}.chart{height:500px}.check{align-items:flex-start;flex-direction:column;gap:5px}.check b{white-space:normal}}
  </style>
</head>
<body>
<main>
  <header class="hero">
    <div class="brand"><i></i> التحليل الفني الذكي</div>
    <h1>تحليل أسهم بورصة قطر</h1>
    <p>قرار فني واضح مبني على حركة السعر والشموع وحجم التداول</p>
  </header>

  <div class="search-wrap"><form id="searchForm" class="search">
      <input id="stockInput" list="stocks" placeholder="اكتب اسم الشركة أو رمز السهم، مثال QNBK" required autocomplete="off">
      <datalist id="stocks">
        <option value="QNBK">بنك قطر الوطني</option><option value="QIBK">مصرف قطر الإسلامي</option>
        <option value="IQCD">صناعات قطر</option><option value="ORDS">أريدُ</option>
        <option value="QGTS">ناقلات</option><option value="MARK">مصرف الريان</option>
        <option value="CBQK">البنك التجاري</option><option value="DUBK">بنك دخان</option>
        <option value="QAMC">قامكو</option><option value="BRES">بروة</option>
      </datalist>
      <button type="submit">تحليل السهم</button>
  </form></div>
  <div id="message">أدخل السهم ثم اضغط تحليل.</div>

  <section class="signal-browser" aria-label="جرد إشارات الأسهم">
    <div class="signal-tabs">
      <button class="signal-tab buy" data-list="buy" type="button">أسهم الشراء <b id="buyCount">—</b></button>
      <button class="signal-tab sell" data-list="sell" type="button">أسهم البيع <b id="sellCount">—</b></button>
      <button class="signal-tab watch" data-list="watch" type="button">تحت المراقبة <b id="watchCount">—</b></button>
    </div>
    <div id="signalList" class="signal-list hidden"></div>
  </section>

  <section id="result" class="hidden">
    <div class="grid">
      <article class="card stock-card">
        <p class="eyebrow">بيانات السهم</p><h2 id="companyName">—</h2><span id="symbol" class="symbol">—</span>
        <div id="price" class="price">—</div>
        <p id="quoteDetails" class="quote-line">—</p>
      </article>
      <article id="decisionCard" class="card decision">
        <small>قرار محرك التحليل</small><h2 id="decision">انتظار</h2><p id="reason">—</p>
        <div class="levels"><div><span>سعر التفعيل</span><b id="entry">—</b></div><div><span>إلغاء الإشارة</span><b id="stop">—</b></div><div><span>الثقة</span><b id="score">—</b></div></div>
        <div id="lastSignal" class="signal-note"></div>
      </article>
    </div>
    <article class="card checks"><h2 class="section-title">تفاصيل الشروط الفنية</h2><div id="checks"></div></article>
    <article class="card chart"><div class="chart-head"><h2>الرسم البياني للشموع</h2><div class="chart-tools"><button id="dailyChart" class="interval-btn active" type="button">يومي</button><button id="hourlyChart" class="interval-btn" type="button">ساعة</button><span id="chartInterval">1D</span></div></div><div id="chartBox" class="chart-box"></div></article>
  </section>
</main>
<script>
  const aliases={
    'بنك قطر الوطني':'QNBK','qnb':'QNBK','المصرف':'QIBK','مصرف قطر الإسلامي':'QIBK',
    'صناعات قطر':'IQCD','أريد':'ORDS','أريدُ':'ORDS','ناقلات':'QGTS','الريان':'MARK',
    'مصرف الريان':'MARK','البنك التجاري':'CBQK','بنك دخان':'DUBK','قامكو':'QAMC','بروة':'BRES'
  };
  const $=id=>document.getElementById(id);
  const API_BASE='https://trade-kappa-rouge.vercel.app';
  const normalize=value=>aliases[value.trim().toLowerCase()]||value.trim().toUpperCase();
  const number=value=>value==null?'—':Number(value).toLocaleString('ar-QA',{maximumFractionDigits:3});
  let signalData=null;

  function drawSignalList(type){
    document.querySelectorAll('.signal-tab').forEach(button=>button.classList.toggle('active',button.dataset.list===type));
    const host=$('signalList'),titles={buy:'أسهم الشراء',sell:'أسهم البيع',watch:'الأسهم تحت المراقبة'},items=signalData?.[type]||[];
    host.classList.remove('hidden');
    host.innerHTML=`<div class="signal-list-head"><h2>${titles[type]}</h2><small>${items.length} سهم</small></div>`+(items.length?items.map(item=>`<button class="signal-row" type="button" data-symbol="${item.symbol}"><strong>${item.name}<br><small>QSE:${item.symbol}</small></strong><span>${item.score}%</span><span>تفعيل ${number(item.entry)}</span><span class="stop-col">إلغاء ${number(item.stop)}</span></button>`).join(''):'<div class="signal-empty">لا توجد أسهم في هذه القائمة حاليًا.</div>');
    host.querySelectorAll('[data-symbol]').forEach(row=>row.addEventListener('click',()=>{$('stockInput').value=row.dataset.symbol;$('searchForm').requestSubmit();window.scrollTo({top:0,behavior:'smooth'})}));
  }

  async function openSignalList(type){
    if(!signalData){
      $('signalList').classList.remove('hidden');$('signalList').innerHTML='<div class="signal-empty">جارٍ فحص الأسهم وتطبيق الشروط…</div>';
      try{const response=await fetch(`${API_BASE}/api/signals`),data=await response.json();if(!response.ok)throw new Error(data.error||'تعذر جرد الأسهم.');signalData=data;$('buyCount').textContent=data.buy.length;$('sellCount').textContent=data.sell.length;$('watchCount').textContent=data.watch.length}
      catch(error){$('signalList').innerHTML=`<div class="signal-empty">تعذر تحميل القوائم: ${error.message}</div>`;return}
    }
    drawSignalList(type);
  }

  async function loadStocks(){
    try{
      const response=await fetch(`${API_BASE}/api/stocks`),data=await response.json();
      if(!response.ok||!Array.isArray(data.stocks))return;
      const list=$('stocks');list.innerHTML='';
      for(const stock of data.stocks){
        const option=document.createElement('option');option.value=stock.symbol;option.label=stock.arabicName||stock.englishName||stock.symbol;list.appendChild(option);
        for(const name of [stock.symbol,stock.arabicName,stock.englishName])if(name)aliases[String(name).trim().toLowerCase()]=stock.symbol;
      }
    }catch{}
  }

  async function fetchAnalysis(symbol){
    const columns=['name','description','open','high','low','close','volume','change','Recommend.All','RSI','SMA20','SMA50','average_volume_30d_calc'];
    const response=await fetch('https://scanner.tradingview.com/qatar/scan',{
      method:'POST',
      // text/plain is intentional: it is a CORS "simple request". TradingView
      // accepts the JSON body but does not allow Content-Type in preflight.
      headers:{'Content-Type':'text/plain;charset=UTF-8'},
      body:JSON.stringify({symbols:{tickers:[`QSE:${symbol}`],query:{types:[]}},columns})
    });
    if(!response.ok)throw new Error(`تعذر الاتصال بمصدر البيانات (${response.status})`);
    const payload=await response.json(),row=payload.data?.[0];
    if(!row)throw new Error('لم يتم العثور على الرمز في بورصة قطر.');
    const x=Object.fromEntries(columns.map((name,index)=>[name,row.d[index]]));
    const close=Number(x.close),open=Number(x.open),rsi=Number(x.RSI),sma20=Number(x.SMA20),sma50=Number(x.SMA50),recommend=Number(x['Recommend.All']);
    const volumeRatio=Number(x.average_volume_30d_calc)>0?Number(x.volume)/Number(x.average_volume_30d_calc):null;
    const buy=[
      {name:'المسار العام صاعد',passed:close>sma20&&sma20>sma50},
      {name:'ملخص المؤشرات إيجابي',passed:recommend>=.1},
      {name:'RSI يدعم الشراء',passed:rsi>=40&&rsi<=70},
      {name:'الإغلاق أعلى الافتتاح',passed:close>open},
      {name:'حجم أعلى من المتوسط',passed:volumeRatio!=null&&volumeRatio>=1.2}
    ];
    const sell=[
      {name:'المسار العام هابط',passed:close<sma20&&sma20<sma50},
      {name:'ملخص المؤشرات سلبي',passed:recommend<=-.1},
      {name:'RSI يدعم البيع',passed:rsi<=60},
      {name:'الإغلاق أدنى الافتتاح',passed:close<open},
      {name:'حجم أعلى من المتوسط',passed:volumeRatio!=null&&volumeRatio>=1.2}
    ];
    const weights=[30,25,15,15,15],score=checks=>checks.reduce((sum,c,i)=>sum+(c.passed?weights[i]:0),0);
    const buyScore=score(buy),sellScore=score(sell);let decision='wait',checks=buyScore>=sellScore?buy:sell,finalScore=Math.max(buyScore,sellScore);
    if(buyScore>=60&&buyScore>sellScore)decision='buy';else if(sellScore>=60&&sellScore>buyScore)decision='sell';
    return {symbol,companyName:x.description,quote:{last:x.close,open:x.open,high:x.high,low:x.low,volume:x.volume,change:x.change},analysis:{decision,score:finalScore,entry:decision==='buy'?x.high:decision==='sell'?x.low:null,stop:decision==='buy'?Number(x.low)*.9965:decision==='sell'?Number(x.high)*1.0035:null,reason:decision==='buy'?'توافقت خلفية المسار مع مؤشرات الشراء.':decision==='sell'?'توافقت خلفية المسار مع مؤشرات البيع.':'الشروط متعارضة أو لم تبلغ حد التأكيد.',checks}};
  }

  let currentChart={symbol:'',daily:[],hourly:[]};
  function showCandlestickChart(symbol,candles=[],interval='1D'){
    const host=$('chartBox');host.innerHTML='';$('chartInterval').textContent=`QSE:${symbol} · ${interval}`;
    const rows=(candles||[]).filter(c=>[c.open,c.high,c.low,c.close].every(v=>Number.isFinite(Number(v)))).slice(-100);
    if(rows.length<2){host.innerHTML='<div class="chart-empty">لا يتوفر تاريخ كافٍ لرسم الشموع لهذا السهم.<br>سيظهر الرسم بعد إضافة ملف البيانات التاريخية.</div>';return}
    const canvas=document.createElement('canvas');host.appendChild(canvas);
    const draw=()=>{
      const ratio=Math.max(1,window.devicePixelRatio||1),rect=host.getBoundingClientRect(),w=Math.max(300,rect.width),h=Math.max(280,rect.height);canvas.width=w*ratio;canvas.height=h*ratio;canvas.style.width=`${w}px`;canvas.style.height=`${h}px`;
      const ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);ctx.clearRect(0,0,w,h);
      const pad={top:22,right:68,bottom:34,left:18},cw=w-pad.left-pad.right,ch=h-pad.top-pad.bottom,min=Math.min(...rows.map(c=>+c.low)),max=Math.max(...rows.map(c=>+c.high)),span=Math.max(.001,max-min),x=i=>pad.left+(i+.5)*cw/rows.length,y=v=>pad.top+(max-v)/span*ch;
      ctx.font="11px Cairo";ctx.strokeStyle='#e4edf1';ctx.fillStyle='#6e7f8c';ctx.lineWidth=1;
      for(let i=0;i<=5;i++){const py=pad.top+i*ch/5,value=max-i*span/5;ctx.beginPath();ctx.moveTo(pad.left,py);ctx.lineTo(w-pad.right,py);ctx.stroke();ctx.textAlign='left';ctx.fillText(value.toFixed(2),w-pad.right+8,py+4)}
      const step=cw/rows.length,body=Math.max(2,Math.min(9,step*.62));rows.forEach((c,i)=>{const rising=+c.close>=+c.open,color=rising?'#0d9276':'#d14d58',cx=x(i);ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(cx,y(+c.high));ctx.lineTo(cx,y(+c.low));ctx.stroke();const top=y(Math.max(+c.open,+c.close)),height=Math.max(1.5,Math.abs(y(+c.open)-y(+c.close)));ctx.fillRect(cx-body/2,top,body,height)});
      ctx.fillStyle='#6e7f8c';ctx.textAlign='center';const labels=5;for(let i=0;i<labels;i++){const index=Math.round(i*(rows.length-1)/(labels-1)),raw=rows[index].date,label=interval==='60'?`${raw.slice(5,10)} ${raw.slice(11,16)}`:raw.slice(5,10);ctx.fillText(label,x(index),h-11)}
      const last=rows.at(-1),lastY=y(+last.close);ctx.strokeStyle='#176b87';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(pad.left,lastY);ctx.lineTo(w-pad.right,lastY);ctx.stroke();ctx.setLineDash([]);
    };
    requestAnimationFrame(draw);if(window.chartObserver)window.chartObserver.disconnect();window.chartObserver=new ResizeObserver(draw);window.chartObserver.observe(host);
  }

  function render(data){
    $('result').classList.remove('hidden');$('companyName').textContent=data.companyName||data.symbol;$('symbol').textContent=`QSE:${data.symbol}`;
    $('price').textContent=`${number(data.quote?.last)} ر.ق`;
    $('quoteDetails').textContent=`العرض ${number(data.quote?.ask)} | الطلب ${number(data.quote?.bid)} | الحجم ${number(data.quote?.volume)}`;
    const decision=data.analysis?.decision||'wait';
    const watch=data.analysis?.watch;
    const labels={buy:'شراء',sell:'بيع',wait:'انتظار'};
    const snapshotPartial=data.analysis?.mode==='snapshot-partial';
    $('decisionCard').className=`card decision ${decision!=='wait'?decision:''}`;$('decision').textContent=watch&&decision==='wait'?`مراقبة ${labels[watch.side]}`:`${labels[decision]}${snapshotPartial?' أولي':''}`;$('reason').textContent=data.analysis?.reason||'لم تكتمل شروط الدخول.';
    $('entry').textContent=number(decision==='wait'?watch?.entry:data.analysis?.entry);$('stop').textContent=number(decision==='wait'?watch?.stop:data.analysis?.stop);$('score').textContent=`${data.analysis?.score||0}%`;
    const last=data.analysis?.lastHistoricalSignal;$('lastSignal').textContent=last?`آخر إشارة تاريخية: ${labels[last.decision]} · ${last.date} · ${last.score}% · التفعيل ${number(last.entry)}`:'';
    $('checks').innerHTML=(data.analysis?.checks||[]).map(c=>`<div class="check"><span>${c.name}</span><b class="${!c.available?'':c.passed?'ok':'no'}">${!c.available?'— البيانات غير متوفرة':c.passed?'✓ متحقق':'× غير متحقق'}</b></div>`).join('');
    currentChart={symbol:data.symbol,daily:data.chart?.daily?.candles||data.chart?.candles||[],hourly:data.chart?.hourly?.candles||[]};
    $('dailyChart').classList.add('active');$('hourlyChart').classList.remove('active');showCandlestickChart(data.symbol,currentChart.daily,'1D');
  }

  $('searchForm').addEventListener('submit',async event=>{
    event.preventDefault();const symbol=normalize($('stockInput').value);$('message').textContent='جارٍ جلب البيانات وتطبيق الشروط…';
    try{
      const response=await fetch(`${API_BASE}/api/analyze?symbol=${encodeURIComponent(symbol)}`);
      const data=await response.json();
      if(!response.ok)throw new Error(data.error||'تعذر تحليل السهم.');
      render(data);$('message').textContent=data.analysis?.mode==='data-integrity-error'?`تم إيقاف التحليل لحماية المستخدم: ${data.analysis.reason}`:data.analysis?.mode==='snapshot-partial'?`تنبيه: تحليل أولي؛ التاريخ المخزن ${data.history?.storedCandles||0} من ${data.history?.requiredCandles||120} شمعة.`:data.analysis?.coverage?.intraday?`تحليل الدورة كامل بجميع الفواصل — آخر تحديث: ${data.updatedAt||'الآن'}`:`تحليل مسائي كامل للشهري والأسبوعي واليومي؛ تأكيد الفاصل الصغير غير متوفر — آخر تحديث: ${data.updatedAt||'الآن'}`;
    }catch(error){$('message').textContent=`تعذر إكمال التحليل: ${error.message}`;}
  });
  $('dailyChart').addEventListener('click',()=>{$('dailyChart').classList.add('active');$('hourlyChart').classList.remove('active');showCandlestickChart(currentChart.symbol,currentChart.daily,'1D')});
  $('hourlyChart').addEventListener('click',()=>{$('hourlyChart').classList.add('active');$('dailyChart').classList.remove('active');showCandlestickChart(currentChart.symbol,currentChart.hourly,'60')});
  document.querySelectorAll('.signal-tab').forEach(button=>button.addEventListener('click',()=>openSignalList(button.dataset.list)));
  loadStocks();
</script>
</body>
</html>
