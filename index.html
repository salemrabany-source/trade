<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تحليل أسهم بورصة قطر</title>
  <meta name="theme-color" content="#071b2e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#071b2e;--navy-2:#0e3150;--blue:#176b87;--green:#0d9276;--red:#d14d58;--gold:#d7a84b;--amber:#b97818;--ink:#132a3a;--muted:#6e7f8c;--bg:#f3f7f9;--card:#fff;--line:#dce7ec;--shadow:0 18px 50px rgba(7,27,46,.09)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,rgba(39,144,160,.13),transparent 30%),linear-gradient(180deg,#edf5f7 0,#f8fafb 420px);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif}
    body:before{content:'';position:absolute;inset:0 0 auto;height:370px;background:linear-gradient(135deg,var(--navy),#0b3550 70%,#106276);z-index:-1;clip-path:ellipse(90% 70% at 50% 20%)}
    main{width:min(1120px,92%);margin:0 auto;padding:48px 0 54px}.hero{text-align:center;color:#fff;margin-bottom:30px}.brand{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(255,255,255,.08);font-size:13px;font-weight:600}.brand i{width:8px;height:8px;border-radius:50%;background:#50e3b4;box-shadow:0 0 12px #50e3b4}.hero h1{font-size:clamp(31px,5vw,53px);line-height:1.25;margin:18px 0 8px;font-weight:800;letter-spacing:-1.5px}.hero p{color:#d5e5eb;margin:0;font-size:clamp(14px,2vw,17px)}
    .search-wrap{padding:7px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:22px;box-shadow:0 22px 55px rgba(4,24,39,.24);backdrop-filter:blur(12px)}.search{display:flex;gap:9px;padding:9px;background:#fff;border-radius:15px}.search input{flex:1;min-width:0;padding:14px 18px;border:0;outline:0;border-radius:11px;background:#f5f8fa;color:var(--ink);font:600 15px 'Cairo',sans-serif}.search input:focus{box-shadow:inset 0 0 0 2px rgba(23,107,135,.3);background:#fff}.search button{padding:0 28px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--gold),#efc66d);color:#37270a;font:800 15px 'Cairo',sans-serif;cursor:pointer;transition:.2s}.search button:hover{transform:translateY(-1px);filter:brightness(1.04)}
    #message{margin:14px 8px 20px;color:#557080;min-height:24px;text-align:center;font-size:13px;font-weight:600}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:rgba(255,255,255,.97);border:1px solid rgba(213,226,232,.9);border-radius:22px;padding:25px;box-shadow:var(--shadow)}.stock-card{position:relative;overflow:hidden}.stock-card:after{content:'';position:absolute;width:145px;height:145px;border-radius:50%;background:rgba(23,107,135,.07);left:-55px;bottom:-65px}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;margin:0 0 7px}.stock-card h2{margin:0;font-size:25px}.symbol{color:var(--muted);direction:ltr;display:inline-block;font-weight:700;font-size:13px}.price{font-size:46px;font-weight:800;margin:16px 0 7px;direction:ltr;text-align:right;letter-spacing:-1px}.quote-line{margin:0;color:var(--muted);font-size:13px}
    .decision{color:#fff;background:linear-gradient(145deg,#bd821d,#946214);border:0;position:relative;overflow:hidden}.decision:after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;border:35px solid rgba(255,255,255,.06);left:-70px;top:-75px}.decision.buy{background:linear-gradient(145deg,#0d9878,#08705e)}.decision.sell{background:linear-gradient(145deg,#d7555e,#a93242)}.decision small{color:#ffffffbf;font-weight:600}.decision h2{font-size:40px;margin:10px 0 4px;position:relative;z-index:1}.decision p{color:#ffffffe6;min-height:42px;font-size:13px}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.levels>div{padding:11px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.11);border-radius:12px}.levels span{display:block;color:#ffffffb8;font-size:10px}.levels b{direction:ltr;display:block;margin-top:4px;font-size:14px}
    .checks{margin-top:18px}.section-title{display:flex;align-items:center;gap:9px;margin:0 0 8px;font-size:20px}.section-title:before{content:'';width:5px;height:25px;border-radius:4px;background:linear-gradient(var(--blue),#39a99d)}.check{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding:13px 3px;font-size:13px}.check:last-child{border:0}.check b{font-size:12px;white-space:nowrap}.ok{color:var(--green)}.no{color:var(--red)}
    .chart{height:600px;margin-top:18px;padding:7px;overflow:hidden}.chart>div{border-radius:16px;overflow:hidden}.hidden{display:none}
    @media(max-width:720px){main{width:min(94%,1120px);padding-top:30px}.hero h1{letter-spacing:-1px}.search-wrap{border-radius:18px}.search{flex-direction:column}.search button{height:50px}.grid{grid-template-columns:1fr}.card{padding:20px;border-radius:18px}.price{font-size:38px}.decision h2{font-size:34px}.levels{gap:6px}.levels>div{padding:9px 6px}.chart{height:500px}.check{align-items:flex-start;flex-direction:column;gap:5px}.check b{white-space:normal}}
  </style>
</head>
<body>
<main>
  <header class="hero">
    <div class="brand"><i></i> التحليل الفني الذكي</div>
    <h1>تحليل أسهم بورصة قطر</h1>
    <p>قرار فني واضح مبني على حركة السعر والشموع وحجم التداول</p>
  </header>

  <div class="search-wrap"><form id="searchForm" class="search">
      <input id="stockInput" list="stocks" placeholder="اكتب اسم الشركة أو رمز السهم، مثال QNBK" required autocomplete="off">
      <datalist id="stocks">
        <option value="QNBK">بنك قطر الوطني</option><option value="QIBK">مصرف قطر الإسلامي</option>
        <option value="IQCD">صناعات قطر</option><option value="ORDS">أريدُ</option>
        <option value="QGTS">ناقلات</option><option value="MARK">مصرف الريان</option>
        <option value="CBQK">البنك التجاري</option><option value="DUBK">بنك دخان</option>
        <option value="QAMC">قامكو</option><option value="BRES">بروة</option>
      </datalist>
      <button type="submit">تحليل السهم</button>
  </form></div>
  <div id="message">أدخل السهم ثم اضغط تحليل.</div>

  <section id="result" class="hidden">
    <div class="grid">
      <article class="card stock-card">
        <p class="eyebrow">بيانات السهم</p><h2 id="companyName">—</h2><span id="symbol" class="symbol">—</span>
        <div id="price" class="price">—</div>
        <p id="quoteDetails" class="quote-line">—</p>
      </article>
      <article id="decisionCard" class="card decision">
        <small>قرار محرك التحليل</small><h2 id="decision">انتظار</h2><p id="reason">—</p>
        <div class="levels"><div><span>سعر التفعيل</span><b id="entry">—</b></div><div><span>إلغاء الإشارة</span><b id="stop">—</b></div><div><span>الثقة</span><b id="score">—</b></div></div>
      </article>
    </div>
    <article class="card checks"><h2 class="section-title">تفاصيل الشروط الفنية</h2><div id="checks"></div></article>
    <article class="card chart"><div id="tvWidget" style="height:100%;width:100%"></div></article>
  </section>
</main>
<script>
  const aliases={
    'بنك قطر الوطني':'QNBK','qnb':'QNBK','المصرف':'QIBK','مصرف قطر الإسلامي':'QIBK',
    'صناعات قطر':'IQCD','أريد':'ORDS','أريدُ':'ORDS','ناقلات':'QGTS','الريان':'MARK',
    'مصرف الريان':'MARK','البنك التجاري':'CBQK','بنك دخان':'DUBK','قامكو':'QAMC','بروة':'BRES'
  };
  const $=id=>document.getElementById(id);
  const API_BASE='https://trade-kappa-rouge.vercel.app';
  const normalize=value=>aliases[value.trim().toLowerCase()]||value.trim().toUpperCase();
  const number=value=>value==null?'—':Number(value).toLocaleString('ar-QA',{maximumFractionDigits:3});

  async function fetchAnalysis(symbol){
    const columns=['name','description','open','high','low','close','volume','change','Recommend.All','RSI','SMA20','SMA50','average_volume_30d_calc'];
    const response=await fetch('https://scanner.tradingview.com/qatar/scan',{
      method:'POST',
      // text/plain is intentional: it is a CORS "simple request". TradingView
      // accepts the JSON body but does not allow Content-Type in preflight.
      headers:{'Content-Type':'text/plain;charset=UTF-8'},
      body:JSON.stringify({symbols:{tickers:[`QSE:${symbol}`],query:{types:[]}},columns})
    });
    if(!response.ok)throw new Error(`تعذر الاتصال بمصدر البيانات (${response.status})`);
    const payload=await response.json(),row=payload.data?.[0];
    if(!row)throw new Error('لم يتم العثور على الرمز في بورصة قطر.');
    const x=Object.fromEntries(columns.map((name,index)=>[name,row.d[index]]));
    const close=Number(x.close),open=Number(x.open),rsi=Number(x.RSI),sma20=Number(x.SMA20),sma50=Number(x.SMA50),recommend=Number(x['Recommend.All']);
    const volumeRatio=Number(x.average_volume_30d_calc)>0?Number(x.volume)/Number(x.average_volume_30d_calc):null;
    const buy=[
      {name:'المسار العام صاعد',passed:close>sma20&&sma20>sma50},
      {name:'ملخص المؤشرات إيجابي',passed:recommend>=.1},
      {name:'RSI يدعم الشراء',passed:rsi>=40&&rsi<=70},
      {name:'الإغلاق أعلى الافتتاح',passed:close>open},
      {name:'حجم أعلى من المتوسط',passed:volumeRatio!=null&&volumeRatio>=1.2}
    ];
    const sell=[
      {name:'المسار العام هابط',passed:close<sma20&&sma20<sma50},
      {name:'ملخص المؤشرات سلبي',passed:recommend<=-.1},
      {name:'RSI يدعم البيع',passed:rsi<=60},
      {name:'الإغلاق أدنى الافتتاح',passed:close<open},
      {name:'حجم أعلى من المتوسط',passed:volumeRatio!=null&&volumeRatio>=1.2}
    ];
    const weights=[30,25,15,15,15],score=checks=>checks.reduce((sum,c,i)=>sum+(c.passed?weights[i]:0),0);
    const buyScore=score(buy),sellScore=score(sell);let decision='wait',checks=buyScore>=sellScore?buy:sell,finalScore=Math.max(buyScore,sellScore);
    if(buyScore>=60&&buyScore>sellScore)decision='buy';else if(sellScore>=60&&sellScore>buyScore)decision='sell';
    return {symbol,companyName:x.description,quote:{last:x.close,open:x.open,high:x.high,low:x.low,volume:x.volume,change:x.change},analysis:{decision,score:finalScore,entry:decision==='buy'?x.high:decision==='sell'?x.low:null,stop:decision==='buy'?Number(x.low)*.9965:decision==='sell'?Number(x.high)*1.0035:null,reason:decision==='buy'?'توافقت خلفية المسار مع مؤشرات الشراء.':decision==='sell'?'توافقت خلفية المسار مع مؤشرات البيع.':'الشروط متعارضة أو لم تبلغ حد التأكيد.',checks}};
  }

  function showTradingView(symbol){
    const host=$('tvWidget'); host.innerHTML='';
    const box=document.createElement('div');box.className='tradingview-widget-container';box.style.cssText='height:100%;width:100%';
    box.innerHTML='<div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>';
    const script=document.createElement('script');script.async=true;script.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
    script.text=JSON.stringify({autosize:true,symbol:`QSE:${symbol}`,interval:'D',timezone:'Asia/Qatar',theme:'light',style:'1',locale:'ar_AE',hide_side_toolbar:false,allow_symbol_change:false,support_host:'https://www.tradingview.com'});
    box.appendChild(script);host.appendChild(box);
  }

  function render(data){
    $('result').classList.remove('hidden');$('companyName').textContent=data.companyName||data.symbol;$('symbol').textContent=`QSE:${data.symbol}`;
    $('price').textContent=`${number(data.quote?.last)} ر.ق`;
    $('quoteDetails').textContent=`العرض ${number(data.quote?.ask)} | الطلب ${number(data.quote?.bid)} | الحجم ${number(data.quote?.volume)}`;
    const decision=data.analysis?.decision||'wait',labels={buy:'شراء',sell:'بيع',wait:'انتظار'};
    const snapshotPartial=data.analysis?.mode==='snapshot-partial';
    $('decisionCard').className=`card decision ${decision}`;$('decision').textContent=`${labels[decision]}${snapshotPartial?' أولي':''}`;$('reason').textContent=data.analysis?.reason||'لم تكتمل شروط الدخول.';
    $('entry').textContent=decision==='wait'?'لا توجد إشارة':number(data.analysis?.entry);$('stop').textContent=decision==='wait'?'لا توجد إشارة':number(data.analysis?.stop);$('score').textContent=`${data.analysis?.score||0}%`;
    $('checks').innerHTML=(data.analysis?.checks||[]).map(c=>`<div class="check"><span>${c.name}</span><b class="${!c.available?'':c.passed?'ok':'no'}">${!c.available?'— البيانات غير متوفرة':c.passed?'✓ متحقق':'× غير متحقق'}</b></div>`).join('');
    showTradingView(data.symbol);
  }
  $('searchForm').addEventListener('submit',async event=>{
    event.preventDefault();const symbol=normalize($('stockInput').value);$('message').textContent='جارٍ جلب البيانات وتطبيق الشروط…';
    try{
      const response=await fetch(`${API_BASE}/api/analyze?symbol=${encodeURIComponent(symbol)}`);
      const data=await response.json();
      if(!response.ok)throw new Error(data.error||'تعذر تحليل السهم.');
      render(data);$('message').textContent=data.analysis?.mode==='snapshot-partial'?`تنبيه: تحليل أولي؛ التاريخ المخزن ${data.history?.storedCandles||0} من ${data.history?.requiredCandles||120} شمعة.`:data.analysis?.coverage?.intraday?`تحليل الدورة كامل بجميع الفواصل — آخر تحديث: ${data.updatedAt||'الآن'}`:`تحليل مسائي كامل للشهري والأسبوعي واليومي؛ تأكيد الفاصل الصغير غير متوفر — آخر تحديث: ${data.updatedAt||'الآن'}`;
    }catch(error){$('message').textContent=`تعذر إكمال التحليل: ${error.message}`;}
  });
</script>
</body>
</html>
