name: Collect Qatar hourly candles
on:
  schedule:
    # TradingView's Qatar feed is delayed about 15 minutes. At :14 the
    # displayed hourly candle is near the end of the preceding UTC hour.
    - cron: '14 7-11 * * 0-4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qatar-market-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/collect-intraday.mjs
      - name: Commit updated hourly candles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intraday/*-60.json
          git diff --cached --quiet || git commit -m "data: update Qatar hourly candles"
          git push
